<script id="egj_calendar_template" type="text/x-handlebars-template">
  <div class="container-fluid text-dark visible-on-print" style="width: 210mm; height: 297mm; margin: 0; padding: 20mm 15mm; box-sizing: border-box; page-break-after: always;">
    
    <!-- Header -->
    <div class="row text-center mb-4">
      <div class="col">
        <h1 style="font-size: 2.5rem; font-weight: bold; color: #159989; margin-bottom: 0.5rem;">
          Erfindergeist Jülich e.V.
        </h1>
        <h2 style="font-size: 2rem; color: #333; margin-top: 0;">
          Termine
        </h2>
      </div>
    </div>

    <hr style="border-top: 3px solid #159989; margin-bottom: 2rem;">

    <!-- Termine Liste (6-10 Einträge) -->
    <div class="container-fluid" style="flex: 1; margin-bottom: 2rem;">
      {{#each (first this 10)}}
        {{#if (isEven @index)}}
          <div class="bd-container" style="margin-bottom: 1.2rem; padding: 1rem; border-left: 5px solid #159989;">
        {{else}}
          <div class="bd-container-even" style="margin-bottom: 1.2rem; padding: 1rem; border-left: 5px solid #F9B338;">
        {{/if}}
            <div class="row">
              <div class="col-12">
                <h3 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; color: #333;">
                  {{summary}}
                </h3>
              </div>
            </div>
            <div class="row">
              <div class="col-8" style="font-size: 1.2rem;">
                {{#if (ifEquals (getDateFromDt dtstart) (getDateFromDt dtend))}}
                  📅 {{getDateFromDt dtstart}} &nbsp;&nbsp; 🕑 {{getTimeFromDt dtstart}} - {{getTimeFromDt dtend}}
                {{else}}
                  📅 {{getDateFromDt dtstart}} - {{getDateFromDt dtend}} &nbsp;&nbsp; 🕑 {{getTimeFromDt dtstart}} - {{getTimeFromDt dtend}}
                {{/if}}
              </div>
              <div class="col-4 text-end" style="font-size: 1.2rem; font-weight: 500;">
                {{#if (include (getTags description) "Stadtbücherei")}}
                  📚 Stadtbücherei
                {{/if}}
                {{#if (include (getTags description) "Awo")}}
                  🏢 AWO
                {{/if}}
              </div>
            </div>
          </div>
      {{/each}}
    </div>

    <!-- Footer mit QR-Code und Kontaktdaten -->
    <div style="position: absolute; bottom: 15mm; left: 15mm; right: 15mm;">
      <hr style="border-top: 2px solid #159989; margin-bottom: 1rem;">
      <div class="row align-items-center">
        <div class="col-3 text-center">
          <img src="./QRlinktree.png" alt="QR Code" style="width: 80mm; height: auto; max-width: 100%;">
        </div>
        <div class="col-9">
          <div style="font-size: 1.1rem; line-height: 1.8;">
            <p style="margin: 0.3rem 0;"><strong>Erfindergeist Jülich e.V.</strong></p>
            <p style="margin: 0.3rem 0;">📍 Ihre Adresse hier</p>
            <p style="margin: 0.3rem 0;">📞 Telefon: +49 (0) 2461 123456</p>
            <p style="margin: 0.3rem 0;">✉️ E-Mail: kontakt@erfindergeist.org</p>
            <p style="margin: 0.3rem 0; font-size: 0.9rem; color: #666;">Stand: {{today}}</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</script>

<style>
@media print {
  @page {
    size: A4;
    margin: 0;
  }
  
  body {
    margin: 0;
    padding: 0;
  }
  
  .container-fluid {
    width: 210mm !important;
    height: 297mm !important;
  }
}
</style>
